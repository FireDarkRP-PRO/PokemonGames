<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multijoueur – Jeux Pokémon</title><link rel="stylesheet" href="../Ressource/style.css"></head>
<body><main>
<a class="retour" href="../index.html">Retour au menu</a>
<h1>Multijoueur</h1>
<section id="accueil" class="lobby">
<p class="intro">Crée un salon et partage le code, ou rejoins celui d'un ami. À deux, vous jouez en duel : chacun son tour, le premier qui trouve la bonne réponse gagne la manche.</p>
<div class="saisie"><label>Ton pseudo <input id="nom" maxlength="16" value="Joueur"></label></div>
<div class="saisie"><button id="creer" type="button">Créer un salon</button></div>
<div class="saisie"><input id="code" maxlength="5" placeholder="Code du salon" autocomplete="off"><button id="rejoindre" type="button" class="sec">Rejoindre</button></div>
<p id="msg" aria-live="polite"></p>
</section>
<section id="salon" class="lobby" hidden>
<p>Code du salon : <strong id="codeaff"></strong></p>
<ul id="joueurs"></ul>
<p id="attente" aria-live="polite"></p>
<div class="saisie"><button id="jouer" type="button" hidden>Jouer</button></div>
</section>
<section id="menu" class="lobby" hidden>
<p class="vic"></p>
<p id="aide" aria-live="polite"></p>
<div id="jeux"></div>
</section>
<section id="duel" class="lobby" hidden>
<p class="vic"></p>
<div class="saisie"><button id="rejouer" type="button" hidden>Nouvelle manche</button><button id="changer" type="button" class="sec">Retour à la sélection des jeux</button></div>
<iframe id="cadre" title="Duel en cours"></iframe>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../Ressource/core.js"></script><script src="../Ressource/multi.js"></script>
<script type="module" src="../Ressource/firebase.js"></script>
</body></html>
