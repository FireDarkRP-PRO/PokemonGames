<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multijoueur – Jeux Pokémon</title><link rel="stylesheet" href="../Ressource/style.css"></head>
<body><main>
<a class="retour" href="../index.html">Retour au menu</a>
<h1>Multijoueur</h1>
<section id="accueil" class="lobby">
<p class="intro">Crée un salon et partage le code, ou rejoins celui d'un ami. Tout le monde joue aux mêmes questions et les scores s'affichent en direct.</p>
<div class="saisie"><label>Ton pseudo <input id="nom" maxlength="16" value="Joueur"></label></div>
<div class="saisie"><button id="creer" type="button">Créer un salon</button></div>
<div class="saisie"><input id="code" maxlength="5" placeholder="Code du salon" autocomplete="off"><button id="rejoindre" type="button" class="sec">Rejoindre</button></div>
<p id="msg" aria-live="polite"></p>
</section>
<section id="salon" class="lobby" hidden>
<p>Code du salon : <strong id="codeaff"></strong></p>
<div id="hote" class="saisie" hidden><select id="jeu"></select><button id="lancer" type="button">Lancer la partie</button></div>
<table class="tab"><thead><tr><th>Joueur</th><th>Score</th></tr></thead><tbody id="scores"></tbody></table>
<iframe id="cadre" title="Jeu en cours" hidden></iframe>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../Ressource/core.js"></script><script src="../Ressource/multi.js"></script>
</body></html>
