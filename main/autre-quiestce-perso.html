<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qui est-ce ? – Jeux Pokémon</title><link rel="stylesheet" href="../Ressource/style.css"></head>
<body data-groupe="perso"><main>
<a class="retour" href="../index.html">Retour au menu</a>
<h1>Qui est-ce ?</h1>
<p id="statut" class="vic" aria-live="polite">Chargement…</p>
<section id="p-groupe" class="lobby" hidden>
<p class="intro">Choisis 15 Pokémon : ils rejoindront ceux de ton adversaire pour former le groupe de 30.</p>
<div class="saisie"><input id="ajout" list="noms" autocomplete="off" placeholder="Nom du Pokémon"><button id="ajouter" type="button">Ajouter</button></div>
<div class="saisie"><button id="hasard1" type="button" class="sec">Un au hasard</button><button id="hasard" type="button" class="sec">Compléter au hasard</button></div>
<p><strong id="compteur">0/15</strong></p>
<ul id="mes-pokes" class="puces"></ul>
<div class="saisie"><button id="valider-liste" type="button" disabled>Valider ma sélection</button></div>
<p id="info-groupe" aria-live="polite"></p>
<datalist id="noms"></datalist>
</section>
<div id="zc" class="saisie" hidden><button id="confirmer" type="button"></button></div>
<section id="p-jeu" class="lobby" hidden>
<p id="mon-secret"></p>
<div id="zone-q" hidden>
<label for="question">Ta question (la réponse sera oui ou non)</label>
<textarea id="question" rows="2" maxlength="200"></textarea>
<div class="saisie"><button id="envoyer" type="button">Envoyer la question</button><button id="deviner" type="button" class="sec">Deviner le Pokémon</button></div>
</div>
<div id="zone-r" hidden>
<p id="q-recue" class="q"></p>
<div class="saisie"><button id="oui" type="button">Oui</button><button id="non" type="button" class="sec">Non</button></div>
</div>
</section>
<div id="plateau" class="qe-grille" hidden></div>
<ol id="journal" hidden></ol>
</main>
<script src="../Ressource/core.js"></script><script src="../Ressource/quiestce.js"></script>
</body></html>
